include:
  - path: ../cloudvps-backend/docker-compose.yml
    project_directory: ../cloudvps-backend

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: cloudvps-web
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
